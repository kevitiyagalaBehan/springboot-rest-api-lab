name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you re-run the pipeline manually from the Actions tab

permissions:
  contents: read

defaults:
  run:
    working-directory: demo   # all 'run' steps execute inside the project folder

env:
  APP_DIR: demo             # folder in the repo that contains pom.xml and Dockerfile
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: springboot-rest-api-lab
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------
  # 1. Build & unit test (Java 17, Maven)
  # ---------------------------------------------------------------
  build-test:
    name: 1. Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_DIR }}/pom.xml

      - name: Compile, run unit tests, build JAR
        run: mvn -B verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.APP_DIR }}/target/surefire-reports/
            ${{ env.APP_DIR }}/target/site/jacoco/

  # ---------------------------------------------------------------
  # 2. SAST with SonarCloud + Quality Gate enforcement
  # ---------------------------------------------------------------
  sonarcloud:
    name: 2. SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history gives Sonar accurate "new code" analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_DIR }}/pom.xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyse and wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------
  # 3-5. Container build -> Trivy scan -> push to Amazon ECR
  # ---------------------------------------------------------------
  container:
    name: 3-5. Docker Build, Trivy Scan, ECR Push
    runs-on: ubuntu-latest
    needs: sonarcloud
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 3. Container packaging, tagged with the Git commit SHA
      - name: Build Docker image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      # 4. Vulnerability scanning - pipeline FAILS on CRITICAL CVEs
      - name: Trivy scan (report HIGH and CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/${{ env.APP_DIR }}:/out aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --no-progress --format table \
            --output /out/trivy-report.txt \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cat trivy-report.txt

      - name: Trivy gate (fail build on fixable CRITICAL CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ env.APP_DIR }}/trivy-report.txt

      # 5. Secure AWS authentication and push to ECR
      - name: Configure AWS credentials (least-privilege IAM user, keys in GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "Pushed: $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
